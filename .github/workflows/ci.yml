name: Contextopus validation
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra test
      - run: uv run --locked pytest -q
      - run: uv build --no-sources
      - run: uv run --locked python scripts/build_release.py
      - run: uv run --locked python scripts/verify_release.py
      - run: uv tool install --python ${{ matrix.python }} ./dist/contextopus_core-1.1.0-py3-none-any.whl
      - run: contextopus --version
      - uses: actions/upload-artifact@v4
        with:
          name: contextopus-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/
