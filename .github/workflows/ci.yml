name: Contextopus validation
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra test
      - run: uv run --locked pytest -v --durations=20 -o faulthandler_timeout=120
      - run: uv build --no-sources
      - run: uv run --locked python scripts/build_release.py
      - run: uv run --locked python scripts/verify_release.py
      - name: Install the exact release wheel
        run: >-
          uv run --locked python -c "import pathlib,subprocess,tomllib; version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; subprocess.run(['uv','tool','install','--python','${{ matrix.python }}',f'./dist/contextopus_core-{version}-py3-none-any.whl'],check=True)"
      - run: contextopus --version
      - name: Verify installed resources and MCP entrypoints
        run: >-
          uv run --locked python -c "import pathlib,subprocess,sys,tomllib; prefix=pathlib.Path(subprocess.check_output(['uv','tool','dir'],text=True).strip())/'contextopus-core'; executable=prefix/('Scripts/python.exe' if sys.platform=='win32' else 'bin/python'); version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; subprocess.run([str(executable),'-I','scripts/verify_installed.py','--expected-version',version,'--prefix',str(prefix)],check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: contextopus-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/
  upgrade-1-1-to-1-3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ff711966921c562f22aa7bcdb9358a871c8d4282
          path: .ci/contextopus-v11-source
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra test
      - name: Verify the old writer source identity
        run: >-
          uv run --locked python -c "import pathlib,subprocess,tomllib; old=pathlib.Path('.ci/contextopus-v11-source'); assert subprocess.check_output(['git','-C',str(old),'rev-parse','HEAD'],text=True).strip()=='ff711966921c562f22aa7bcdb9358a871c8d4282'; assert tomllib.loads((old/'pyproject.toml').read_text())['project']['version']=='1.1.0'"
      - run: uv venv --python 3.12 .ci/v11-venv
      - name: Install the pinned 1.1 writer separately
        run: uv pip install --python .ci/v11-venv/bin/python ./.ci/contextopus-v11-source
      - name: Create with the real old writer and migrate its copy
        env:
          CONTEXTOPUS_V11_PYTHON: ${{ github.workspace }}/.ci/v11-venv/bin/python
        run: uv run --locked pytest -v tests/test_upgrade_11_to_13.py -o faulthandler_timeout=120
