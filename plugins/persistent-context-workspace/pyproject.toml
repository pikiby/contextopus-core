[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-context-workspace"
version = "0.7.1"
description = "Local knowledge memory and LanceDB MCP tools for Codex"
requires-python = ">=3.11"
dependencies = ["lancedb>=0.20,<1", "mcp>=1.10,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
local = ["sentence-transformers>=3,<6"]
test = ["pytest>=8"]

[project.scripts]
pcw-runtime = "pcw_runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["pcw_runtime*"]
